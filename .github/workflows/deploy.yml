# Автодеплой на Cloudflare Pages при каждом push в main (в т.ч. новые картинки в site/slides/).
# Нужны секреты репозитория: Settings → Secrets and variables → Actions →
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        run: python3 src/build.py

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check Cloudflare secrets
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # убираем пробелы/переводы строк, случайно вставленные вместе со значением
          T=$(printf %s "$T" | tr -d '[:space:]'); A=$(printf %s "$A" | tr -d '[:space:]')
          echo "token: ${#T} chars, starts '${T:0:5}' (expected 53, 'cfat_'); account id: ${#A} chars (expected 32)"
          [ -n "$T" ] && [ -n "$A" ] || { echo "::error::secret is empty or not named CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          R=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$A/tokens/verify" -H "Authorization: Bearer $T")
          echo "$R" | grep -q '"status":"active"' || { echo "::error::Cloudflare rejected token/account: $(echo "$R" | grep -o '"message":"[^"]*"' | head -3 | tr '\n' ' ')"; exit 1; }
          echo "::notice::Cloudflare token OK; fingerprints token=$(printf 'fp:%s' "$T" | sha256sum | cut -c1-8) account=$(printf 'fp:%s' "$A" | sha256sum | cut -c1-8)"
          echo "CLOUDFLARE_API_TOKEN=$T" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$A" >> "$GITHUB_ENV"

      - name: Deploy
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -o pipefail
          npx -y wrangler@3.114.0 pages deploy site --project-name goldberg-odoo --branch main --commit-dirty=true 2>&1 | tee wrangler.log || {
            echo "::error::wrangler: $(grep -v '^\s*$' wrangler.log | grep -iE 'error|fail|auth|denied|code' | head -8 | tr '\n' ' ' | cut -c1-900)"; exit 1; }
