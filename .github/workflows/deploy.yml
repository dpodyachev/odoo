# Автодеплой на Cloudflare Pages при каждом push в main (в т.ч. новые картинки в site/slides/).
# Нужны секреты репозитория (отдельный токен: только Account → Cloudflare Pages → Edit, без IP-фильтра —
# у GitHub-раннеров IP меняются; локальный токен из .cloudflare привязан к IP сервера и тут не работает):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SITE_PRIVATE (base64 от src/private.json)
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        # личные контакты (адрес, e-mail, телефон, Telegram) — только из секрета SITE_PRIVATE = base64(JSON), см. src/config.py
        env:
          SITE_PRIVATE: ${{ secrets.SITE_PRIVATE }}
        run: |
          [ -n "$SITE_PRIVATE" ] || { echo "::error::нет секрета SITE_PRIVATE (Settings → Secrets → Actions)"; exit 1; }
          pip install -q pillow   # картинка контактов для страниц без JS (Impressum)
          python3 src/build.py

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check Cloudflare secrets
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # убираем пробелы/переводы строк, случайно вставленные вместе со значением
          T=$(printf %s "$T" | tr -d '[:space:]'); A=$(printf %s "$A" | tr -d '[:space:]')
          echo "token: ${#T} chars, starts '${T:0:5}' (expected 53, 'cfat_'); account id: ${#A} chars (expected 32)"
          [ -n "$T" ] && [ -n "$A" ] || { echo "::error::secret is empty or not named CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          api() { curl -s "https://api.cloudflare.com/client/v4/accounts/$A/$1" -H "Authorization: Bearer $T"; }
          msg() { grep -oE '"(code|message)": *("[^"]*"|[0-9]+)' | head -3 | tr '\n' ' '; }
          # 1) токен жив и принадлежит аккаунту (IP-фильтр и права здесь НЕ проверяются)
          R=$(api tokens/verify)
          echo "$R" | grep -qE '"status": *"active"' || { echo "::error::tokens/verify: FAIL $(echo "$R" | msg)"; exit 1; }
          # 2) реальный доступ к Pages-проекту с этого раннера (права Pages + IP-фильтр)
          P=$(api pages/projects/goldberg-odoo)
          echo "$P" | grep -qE '"success": *true' || { echo "::error::tokens/verify: OK, but Pages access: FAIL $(echo "$P" | msg) (нужно право Cloudflare Pages Edit и без IP-фильтра)"; exit 1; }
          echo "::notice::Cloudflare: tokens/verify OK, Pages project goldberg-odoo OK"
          echo "CLOUDFLARE_API_TOKEN=$T" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$A" >> "$GITHUB_ENV"

      - name: Deploy
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -o pipefail
          npx -y wrangler@3.114.0 pages deploy site --project-name goldberg-odoo --branch main --commit-dirty=true 2>&1 | tee wrangler.log || {
            echo "::error::wrangler: $(grep -v '^\s*$' wrangler.log | grep -iE 'error|fail|auth|denied|code' | head -8 | tr '\n' ' ' | cut -c1-900)"; exit 1; }

      - name: IndexNow (Bing и др. узнают о новых/изменённых страницах)
        continue-on-error: true
        run: |
          KEY=$(python3 -c "import sys; sys.path.insert(0,'src'); import config as C; print(getattr(C,'INDEXNOW_KEY',''))")
          [ -n "$KEY" ] || { echo "IndexNow выключен"; exit 0; }
          HOST=$(python3 -c "import sys; sys.path.insert(0,'src'); import config as C; print(C.BASE_URL.split('//')[1])")
          sleep 20   # даём Cloudflare раздать новый деплой (файл ключа должен открываться)
          URLS=$(grep -oE '<loc>[^<]+' site/sitemap.xml | sed 's/<loc>//' | python3 -c "import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          BODY="{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":$URLS}"
          CODE=$(curl -s -o r.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$BODY")
          echo "IndexNow HTTP $CODE $(head -c 300 r.txt)"
          case "$CODE" in 200|202) echo "::notice::IndexNow: $CODE, отправлено $(echo "$URLS" | grep -o http | wc -l) URL";; *) echo "::warning::IndexNow: HTTP $CODE";; esac
